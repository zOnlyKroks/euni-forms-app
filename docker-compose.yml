name: dev-aauth

services:
  mariadb:
    image: mariadb
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 1m
      start_interval: 5s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
     - mysql-data:/var/lib/mysql
     - ./mysql/conf.d:/etc/mysql/conf.d
     - ./mysql/initdb.d:/docker-entrypoint-initdb.d
    environment:
      - MYSQL_ROOT_PASSWORD=${AA_DB_ROOT_PASSWORD}
    networks:
      - int
  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - int
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./conf/local.py:/app/myauth/myauth/settings/local.py
      - ./apps:/app/dev
    env_file:
      - ./.env
    ports:
      - 8000:8000
    networks:
      - int
    depends_on:
      mariadb:
        condition: service_healthy
        restart: true
      redis:
        condition: service_started

networks:
  int:

volumes:
  redis-data:
  mysql-data:
