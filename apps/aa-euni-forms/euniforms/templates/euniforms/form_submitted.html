{% extends "euniforms/base.html" %}
{% load i18n %}

{% block euniforms_content %}
    <div class="card">
        <div class="card-body text-center py-5">
            <i class="fas fa-circle-check fa-3x text-success mb-3"></i>
            <h1 class="h3">{% translate "Response submitted" %}</h1>
            <p class="text-muted">
                {% blocktranslate with title=form_obj.title %}Thanks for filling out "{{ title }}".{% endblocktranslate %}
            </p>
            <a href="{% url 'euniforms:index' %}" class="btn btn-primary">{% translate "Back to forms" %}</a>
        </div>
    </div>
{% endblock %}
